<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="35%" stop-color="#0b1329"/>
      <stop offset="70%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Radial Glows for Dynamic Depth -->
    <radialGradient id="meshGlowCyan" cx="18%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowPurple" cx="82%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowCenter" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Borders & Backgrounds -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Typography & Accent Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanning Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-11px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.2deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-9px) translateX(7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow3 9s ease-in-out infinite; }
      .pulsing-mesh { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
      .stream-path { stroke-dasharray: 6 6; animation: dashFlow 2.5s linear infinite; }
      .radar-arm { transform-origin: 600px 210px; animation: radarRotate 12s linear infinite; }
    </style>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Ambient Glow Orbs -->
  <ellipse class="pulsing-mesh" cx="220" cy="130" rx="340" ry="220" fill="url(#meshGlowCyan)"/>
  <ellipse class="pulsing-mesh" cx="980" cy="290" rx="360" ry="240" fill="url(#meshGlowPurple)"/>
  <ellipse class="pulsing-mesh" cx="600" cy="210" rx="400" ry="200" fill="url(#meshGlowCenter)"/>

  <!-- Radar Discovery Scan Circles (Subtle Background) -->
  <g opacity="0.16" transform="translate(600, 210)">
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle r="220" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="340" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
  </g>

  <!-- Animated Tech Stream Lines -->
  <g opacity="0.4">
    <path class="stream-path" d="M 80 85 Q 320 30 540 95 T 920 75 T 1140 110" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <path class="stream-path" d="M 60 335 Q 340 375 620 325 T 940 345 T 1140 295" fill="none" stroke="#818cf8" stroke-width="1.8"/>
  </g>

  <!-- Floating Dynamic Peripheral Badges (Placed safely away from center title/subtitles) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(65, 46)">
    <rect width="220" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">Agentless Network Scanner</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(920, 46)">
    <rect width="215" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">Automated CMDB Sync</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(75, 335)">
    <rect width="210" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#818cf8"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">Multi-Cloud IPAM &amp; DCIM</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-1" transform="translate(915, 335)">
    <rect width="220" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#f43f5e"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">Shadow IT &amp; Cyber Risk</text>
  </g>

  <!-- Discovery Flow Pipeline Indicator (Bottom Center, Subtle Background) -->
  <g opacity="0.38" transform="translate(365, 332)">
    <rect width="470" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="235" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11.5" letter-spacing="1">
      SUBNET SCAN ➔ FINGERPRINT ➔ TOPOLOGY MAP ➔ CMDB
    </text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unobscured, High Contrast, Centered) -->
  <g filter="url(#softShadow)">
    <!-- Category Pill Badge -->
    <g transform="translate(470, 96)">
      <rect width="260" height="32" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="20" cy="16" r="4.5" fill="#38bdf8"/>
      <text x="138" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">
        ENTERPRISE ASSET INTELLIGENCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="196" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome IT Discovery
    </text>

    <!-- Accent Divider Line -->
    <line x1="340" y1="220" x2="860" y2="220" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="600" y="258" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">
      Automated Asset Discovery, CMDB Population &amp; Network Inventory Architecture
    </text>

    <!-- Secondary Meta / Tagline -->
    <text x="600" y="294" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.5">
      Enterprise SaaS Leaders • Sovereign Open-Source Scanners • Hybrid Cloud Mapping • Real-Time Inventory
    </text>
  </g>
</svg>